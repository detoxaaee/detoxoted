<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>detox</title>
  
  <style>
    html, body { margin:0; padding:0; background:#000; overflow:hidden; touch-action:none; }
    .wrapper { width:100vw; height:100vh; display:grid; place-items:center; }
    .grid {
      width:95vw; height:70vh;
      display:grid;
      grid-template-columns:repeat(5,1fr);
      grid-template-rows:repeat(4,1fr);
      gap:8px;
    }
    .pad {
      background:#111; border-radius:10px;
      display:flex; align-items:center; justify-content:center;
      color:#555; font-size:14px; font-family:sans-serif;
      user-select:none; cursor:pointer;
    }
    .pad.active { background:#00ff88; color:#000; }

    /* Contador de usuarios conectados — arriba centrado */
    #status {
      position: fixed;
      top: 15px; left: 50%;
      transform: translateX(-50%);
      color: #555; font-size: 20px;
      font-family: sans-serif;
      z-index: 200;
    }

    /* Mensaje emergente — aparece desde abajo durante el cooldown */
    #toast {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -40px);
  color: #00ff88;
  font-size: clamp(24px, 4vmin, 28px); /* responsive: escala con el tamaño de pantalla */
  font-family: sans-serif;
  letter-spacing: 0.05em;
  text-align: center;
  width: 80vw; /* limita el ancho para que no desborde en pantallas anchas */
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease, transform 0.3s ease;
}
#toast.visible {
  opacity: 1;
  transform: translate(-50%, -50%); /* centrado perfecto horizontal y vertical */
}

    #loader {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.4s ease;
    }
    #loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #loader img {
      width: 80vmin;
    }
  </style>
</head>
<body>

<!-- Contador de usuarios: se actualiza cuando alguien entra o sale -->
<div id="status">toca para iniciar</div>

<!-- Mensaje emergente: aparece durante el cooldown -->
<div id="toast"></div>

<div id="loader">
  <img src="loading.gif" alt="cargando...">
</div>

<div class="wrapper"><div class="grid" id="grid"></div></div>

<script type="module">

import { createPd } from "./libpd-wasm.js"

// Borra la lógica del protocol y pon tu link de Render directamente
const WS_URL = "wss://detoxoted.onrender.com"

let pd      = null
let pdReady = false
let ws      = null
let motion   = { x: 0, y: 0 }
let rotation = { gamma: 0 }

const statusEl = document.getElementById("status")
const loaderEl = document.getElementById("loader")
const toastEl  = document.getElementById("toast")

function smooth(a, b, f=0.15) { return a + (b-a)*f }

// Actualiza el contador de usuarios en el status
function setUsers(n) {
  statusEl.textContent = `● ${n}`
}

// Durante la carga muestra texto en el status
function setStatus(t) {
  statusEl.textContent = t
}

function hideLoader() {
  loaderEl.classList.add("hidden")
  setTimeout(() => loaderEl.style.display = "none", 400)
}

// ── MENSAJES EMERGENTES (TOAST) ─────────────────────────────────
// Estos mensajes se muestran durante el cooldown.
// Para agregar más, simplemente añadí líneas al array.
const MENSAJES = [
  "escuchá...",
  "dejá que suene",
  "respirá",
  "sentí la sala",
  "aguardá",
  "el silencio también es parte",
  "esperá el momento",
  "dejá espacio",
  "escuchá a los demás",
  "el tiempo es el instrumento"
]

let toastTimer = null  // referencia al timer de ocultado

function mostrarToast() {
  // elegir un mensaje al azar
  const msg = MENSAJES[Math.floor(Math.random() * MENSAJES.length)]
  toastEl.textContent = msg

  // cancelar cualquier timer anterior
  if (toastTimer) clearTimeout(toastTimer)

  // mostrar
  toastEl.classList.add("visible")

  // ocultar después del cooldown
  toastTimer = setTimeout(() => {
    toastEl.classList.remove("visible")
  }, COOLDOWN_MS)
}

// ── API PD ───────────────────────────────────────────────────────
function pdFloat(receiver, value) { pd?.sendFloat(receiver, value) }
function pdList(receiver, values) { pd?.sendList(receiver, values) }

// ── WEBSOCKET ────────────────────────────────────────────────────
function initWebSocket() {
  ws = new WebSocket(WS_URL)

  ws.onopen  = () => { console.log("WS conectado") }
  ws.onclose = () => { console.log("WS desconectado, reconectando..."); setTimeout(initWebSocket, 2000) }
  ws.onerror = (e) => console.warn("WS error:", e)

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data)

    // pad disparado por otro dispositivo
    if (msg.type === "pad") {
      executePad(msg.pad, msg.motionX, msg.motionY, msg.gyro)
    }

    // actualización del contador de usuarios conectados
    if (msg.type === "users") {
      setUsers(msg.count)
    }
  }
}

// ── SENSORES ─────────────────────────────────────────────────────
function initSensors() {
  window.addEventListener("devicemotion", e => {
    if (!e.accelerationIncludingGravity) return
    motion.x = smooth(motion.x, e.accelerationIncludingGravity.x)
    motion.y = smooth(motion.y, e.accelerationIncludingGravity.y)
  })
  window.addEventListener("deviceorientation", e => {
    rotation.gamma = smooth(rotation.gamma, e.gamma || 0)
  })
}

function sensorLoop() {
  if (pdReady) {
    pdFloat("motionX", motion.x)
    pdFloat("motionY", motion.y)
    pdFloat("gyro",    rotation.gamma)
  }
  requestAnimationFrame(sensorLoop)
}

async function requestPermissions() {
  try {
    if (typeof DeviceMotionEvent?.requestPermission === "function") {
      await DeviceMotionEvent.requestPermission()
      await DeviceOrientationEvent.requestPermission()
    }
  } catch(e) { console.warn("permisos:", e) }
}

// ── FLASH ────────────────────────────────────────────────────────
let cameraTrack = null
async function initFlash() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video:{facingMode:"environment"} })
    cameraTrack = stream.getVideoTracks()[0]
  } catch(e) {}
}
function flash(on) {
  cameraTrack?.applyConstraints({ advanced:[{torch:on}] }).catch(()=>{})
}

// ── EJECUTAR PAD ─────────────────────────────────────────────────
function executePad(index, mx, my, gy) {
  if (!pdReady) return

  pdFloat("motionX", mx)
  pdFloat("motionY", my)
  pdFloat("gyro",    gy)
  pdList("pad", [index, index + 1])

  if (index >= 0 && index < 20) { flash(true); setTimeout(() => flash(false), 120) }
  if (index >= 1 && index < 20) { navigator.vibrate?.(80) }

  const pads = document.querySelectorAll(".pad")
  pads[index]?.classList.add("active")
  setTimeout(() => pads[index]?.classList.remove("active"), 80)
}

// ── COOLDOWN GLOBAL ──────────────────────────────────────────────
let ultimoToque = 0
const COOLDOWN_MS = 2500

function playPad(index) {
  const ahora = Date.now()

  if (ahora - ultimoToque < COOLDOWN_MS) {
    // mostrar mensaje emergente durante el tiempo de espera
    mostrarToast()
    console.log(`Bloqueado. Faltan ${COOLDOWN_MS - (ahora - ultimoToque)}ms`)
    return
  }

  ultimoToque = ahora
  executePad(index, motion.x, motion.y, rotation.gamma)

  if (ws?.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({
      type: "pad", pad: index,
      motionX: motion.x, motionY: motion.y, gyro: rotation.gamma
    }))
  }
}

// ── INIT PD ──────────────────────────────────────────────────────
async function initPd() {
  setStatus("cargando patch...")

  const [patchText, samplerText] = await Promise.all([
    fetch("main.pd").then(r => r.text()),
    fetch("sampler.pd").then(r => r.text())
  ])

  pd = await createPd({
    packages: ["vanilla"],
    files: { "sampler.pd": samplerText, "main.pd": patchText },
    entry: "main.pd",
    onPrint: (text) => console.log("[Pd]", text),
    onError: (err)  => console.error("[Pd error]", err.message)
  })

  window._pd = pd

  setStatus("cargando audios...")
  const filesList = []
  for (let i = 1; i <= 20; i++) {
    const res = await fetch(`${i}.wav`)
    if (res.ok) {
      filesList.push({ path: `${i}.wav`, content: new Uint8Array(await res.arrayBuffer()) })
    } else {
      console.warn(`no encontró ${i}.wav`)
    }
  }
  console.log(`audios listos: ${filesList.length}`)

  const originalOnMessage = pd.node.port.onmessage
  await new Promise((resolve) => {
    pd.node.port.onmessage = (e) => {
      if (e.data?.type === "files-written") {
        pd.node.port.onmessage = originalOnMessage
        console.log("audios en FS ✓")
        resolve()
      } else if (e.data?.type === "error") {
        console.error("worklet error:", e.data.message)
        pd.node.port.onmessage = originalOnMessage
        resolve()
      } else {
        originalOnMessage?.call(pd.node.port, e)
      }
    }
    pd.node.port.postMessage({ type: "write-files", files: filesList })
  })

  pd.sendBang("loadbang")
  console.log("loadbang disparado ✓")

  pd.node.connect(pd.audioContext.destination)
  pdReady = true

  hideLoader()
  // el status queda vacío hasta que llegue el primer mensaje "users" del servidor
  setStatus("")

  sensorLoop()
  initWebSocket()
}

// ── GRILLA ───────────────────────────────────────────────────────
const grid = document.getElementById("grid")
for (let i = 0; i < 20; i++) {
  const pad = document.createElement("div")
  pad.className = "pad"
  pad.textContent = i + 1
  pad.addEventListener("pointerdown", () => playPad(i))
  grid.appendChild(pad)
}

// ── ARRANQUE ─────────────────────────────────────────────────────
document.body.addEventListener("pointerdown", async () => {
  setStatus("iniciando...")
  await requestPermissions()
  initSensors()
  await initFlash()
  await initPd()
}, { once: true })

</script>
</body>
</html>
